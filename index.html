<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMU Digital ID Card Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
</head>
<body>

  <div class="workspace">
    <!-- LEFT PANEL: FORM -->
    <div class="form-card">
      <h2>Welcome Party ID Verification</h2>

      <!-- STEP 1: VERIFY -->
<div class="verification-box">
  <label for="rollInput">Enter Full Roll No (e.g. BA24-035 or BA23-035):</label>
  <div class="input-inline">
    <input type="text" id="rollInput" placeholder="e.g. BA24-035">
    <button type="button" id="verifyBtn" class="btn btn-verify">Verify</button>
  </div>
  <div id="statusMessage" class="status-msg"></div>
</div>

      <!-- STEP 2: DETAILS FORM -->
      <form id="idForm" class="locked-form">
        
        <div class="form-row">
          <label>Student Full Name:</label>
          <input type="text" id="nameInput" readonly placeholder="Auto-filled from database">
        </div>

        <div class="form-row">
          <label>Upload Student Photo:</label>
          <input type="file" id="photoInput" accept="image/*" disabled>
        </div>

        <div class="form-row">
          <label>Course Type:</label>
          <div class="radio-box">
            <label><input type="radio" name="courseType" value="BA" checked disabled> Regular B.A.</label>
            <label><input type="radio" name="courseType" value="BED" disabled> Integrated B.A. B.Ed</label>
          </div>
        </div>

        <div class="form-row">
          <label>Department (Honours):</label>
          <select id="subjectSelect" disabled>
            <option value="Economics" selected>Economics</option>
            <option value="English">English</option>
            <option value="Odia">Odia</option>
            <option value="History">History</option>
            <option value="Political Science">Political Science</option>
            <option value="Geography">Geography</option>
            <option value="Education">Education</option>
            <option value="Philosophy">Philosophy</option>
            <option value="Psychology">Psychology</option>
            <option value="Sanskrit">Sanskrit</option>
            <option value="Sociology">Sociology</option>
            <option value="Hindi">Hindi</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Statistics">Statistics</option>
            <option value="Anthropology">Anthropology</option>
          </select>
        </div>

        <div class="form-row">
          <label>Session (Custom Editable):</label>
          <input type="text" id="sessionInput" placeholder="e.g. 2024-2027" disabled>
        </div>

        <div class="button-group">
          <button type="button" id="downloadBtn" class="btn btn-primary" disabled>Download ID Card (PNG)</button>
          <button type="button" id="printBtn" class="btn btn-dark" disabled>Print Card</button>
        </div>
      </form>
    </div>

    <!-- RIGHT PANEL: ID CARD PREVIEW (5.3cm x 8.5cm) -->
    <div class="preview-area">
      <div class="id-card-wrapper" id="idCard">
        
        <!-- SIDE BLUE GRAPHICS -->
        <div class="curve-graphic-left"></div>
        <div class="curve-graphic-right"></div>

        <!-- HEADER -->
        <div class="gmu-header">
          <div class="logo-box">
            <img src="logo.png" alt="GMU Logo" class="univ-emblem" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
          </div>
          <div class="title-box">
            <h1 class="gmu-title">GMU</h1>
            <h2 class="gmu-subtitle">GANGADHAR MEHER<br>UNIVERSITY</h2>
          </div>
        </div>

        <!-- ADDRESS -->
        <div class="gmu-address">
          <p class="addr-line">Amruta Vihar, Sambalpur, Odisha - 768004</p>
          <p class="web-line">Web: www.gmuniversity.ac.in</p>
        </div>

        <!-- PHOTO (2.5cm x 2.8cm) -->
        <div class="photo-frame">
          <img id="cardPhoto" src="https://via.placeholder.com/300x336?text=Photo" alt="Student Photo">
        </div>

        <!-- NAME STRIP -->
        <div class="name-strip">
          <span id="cardName">STUDENT NAME</span>
        </div>

        <!-- ACADEMIC BOX (4.8cm x 1.4cm) -->
        <div class="academic-container">
          <div class="accent-bar"></div>
          <div class="info-content">
            <div class="detail-row">
              <span class="label">Roll No :</span>
              <span class="val" id="cardRoll">BA24-000</span>
            </div>
            <div class="detail-row stream-row">
              <span class="label">Stream :</span>
              <span class="val" id="cardStream">Arts (Honours: Economics)</span>
            </div>
            <div class="detail-row">
              <span class="label">Session :</span>
              <span class="val" id="cardSession">2024-2027</span>
            </div>
          </div>
        </div>

        <!-- WATERMARK -->
        <div class="bottom-watermark"></div>

        <!-- SCANNER QR CODE -->
        <div class="qr-block">
          <img id="cardQrImage" src="" alt="QR" crossorigin="anonymous">
        </div>

        <!-- REGISTRAR SIGNATURE -->
        <div class="registrar-block">
          <img src="signature.png" alt="Signature" class="sig-image" onerror="this.style.visibility='hidden'">
          <span class="sig-label"><!--Registrar</span>-->
        </div>

      </div>
    </div>
  </div>

  <!-- CROP MODAL -->
  <div id="cropModal" class="crop-modal">
    <div class="crop-dialog">
      <h3>Crop Photo (Passport Size)</h3>
      <div class="crop-area">
        <img id="cropImageTarget" src="" alt="Source">
      </div>
      <div class="crop-footer">
        <button id="btnCancelCrop" class="c-btn cancel">Cancel</button>
        <button id="btnApplyCrop" class="c-btn apply">OK</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
